<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download Dominum</title>
<link rel="icon" href="./src/assets/images/transparent-dominum.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0c0e12;
    --surface: #14171e;
    --border: #1e2230;
    --fg: #c8cdd8;
    --fg-muted: #6b7280;
    --accent: #4f8cff;
    --accent-glow: rgba(79,140,255,0.15);
    --error: #ef4444;
    --success: #22c55e;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 1rem;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2.5rem 2rem;
    max-width: 420px;
    width: 100%;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
  }
  .lock-icon {
    width: 56px; height: 56px; border-radius: 14px;
    background: var(--accent-glow);
    display: flex; align-items: center; justify-content: center;
  }
  .lock-icon svg { width: 28px; height: 28px; color: var(--accent); }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700; font-size: 1.5rem;
    letter-spacing: -0.02em;
  }
  .subtitle {
    color: var(--fg-muted); font-size: 0.875rem;
    line-height: 1.5; margin-top: -0.5rem;
  }
  .input-group { width: 100%; display: flex; flex-direction: column; gap: 0.5rem; }
  .input-wrap { position: relative; width: 100%; }
  input {
    width: 100%; padding: 0.75rem 2.75rem 0.75rem 1rem;
    background: var(--bg); border: 1.5px solid var(--border);
    border-radius: 10px; color: var(--fg);
    font-family: 'Inter', sans-serif; font-size: 0.9375rem;
    letter-spacing: 0.05em; outline: none; transition: border-color 0.15s;
  }
  input:focus { border-color: var(--accent); }
  input.error { border-color: var(--error); }
  .toggle-vis {
    position: absolute; right: 0.6rem; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--fg-muted); cursor: pointer; padding: 4px; display: flex;
  }
  .toggle-vis:hover { color: var(--fg); }
  .toggle-vis svg { width: 18px; height: 18px; }
  .error-msg { color: var(--error); font-size: 0.8125rem; min-height: 1.2em; }
  button.primary {
    width: 100%; padding: 0.8rem;
    background: var(--accent); color: #fff;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600; font-size: 0.9375rem;
    border: none; border-radius: 10px; cursor: pointer; transition: opacity 0.15s;
  }
  button.primary:hover { opacity: 0.9; }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .info {
    font-size: 0.75rem; color: var(--fg-muted);
    display: flex; align-items: center; gap: 0.375rem;
  }
  .info svg { width: 14px; height: 14px; flex-shrink: 0; }
  .success-state { display: none; width: 100%; }
  .success-state.show { display: flex; flex-direction: column; align-items: center; gap: 1.25rem; }
  .check-icon {
    width: 56px; height: 56px; border-radius: 50%;
    background: rgba(34,197,94,0.12);
    display: flex; align-items: center; justify-content: center;
  }
  .check-icon svg { width: 28px; height: 28px; color: var(--success); }
  .form-state { display: flex; flex-direction: column; align-items: center; gap: 1.5rem; width: 100%; }
  .form-state.hide { display: none; }
  .spinner {
    width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
    border-radius: 50%; animation: spin 0.6s linear infinite;
    display: inline-block; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .progress-bar {
    width: 100%; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden;
  }
  .progress-bar .fill {
    height: 100%; width: 0%; background: var(--accent); border-radius: 3px;
    transition: width 0.3s;
  }
  .progress-text { font-size: 0.75rem; color: var(--fg-muted); }
</style>
</head>
<body>
<div class="card">
  <div class="form-state" id="formState">
    <div class="lock-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <h1>Dominum</h1>
    <p class="subtitle">This download is password-protected.<br>Enter the access key to continue.</p>
    <div class="input-group">
      <div class="input-wrap">
        <input type="password" id="passInput" placeholder="Enter 16-character key" maxlength="64" autocomplete="off" spellcheck="false">
        <button class="toggle-vis" id="toggleVis" type="button" aria-label="Show password">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <div class="error-msg" id="errorMsg"></div>
    </div>
    <button class="primary" id="unlockBtn">Unlock Download</button>
    <div class="info">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/>
      </svg>
      dominum-main.zip &middot; 9.3 MB
    </div>
  </div>

  <div class="success-state" id="successState">
    <div class="check-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <h1>Access Granted</h1>
    <p class="subtitle">Your download will begin automatically.</p>
    <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">Starting download&hellip;</div>
    <button class="primary" id="downloadBtn" style="display:none;">Download Again</button>
  </div>
</div>

<script>
(function() {
  const passInput = document.getElementById("passInput");
  const unlockBtn = document.getElementById("unlockBtn");
  const errorMsg = document.getElementById("errorMsg");
  const toggleVis = document.getElementById("toggleVis");
  const formState = document.getElementById("formState");
  const successState = document.getElementById("successState");
  const downloadBtn = document.getElementById("downloadBtn");
  const progressFill = document.getElementById("progressFill");
  const progressText = document.getElementById("progressText");

  toggleVis.addEventListener("click", function() {
    passInput.type = passInput.type === "password" ? "text" : "password";
    passInput.focus();
  });

  let attempts = 0;

  async function tryUnlock() {
    var val = passInput.value;
    errorMsg.textContent = "";
    passInput.classList.remove("error");

    if (!val) {
      errorMsg.textContent = "Please enter the access key.";
      passInput.classList.add("error");
      return;
    }

    unlockBtn.disabled = true;
    unlockBtn.innerHTML = '<span class="spinner"></span> Verifying…';

    try {
      var res = await fetch("/api/download/verify", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({password: val})
      });
      var data = await res.json();

      if (!data.ok) {
        attempts++;
        passInput.classList.add("error");
        if (attempts >= 5) {
          errorMsg.textContent = "Too many attempts. Refresh and try again.";
          unlockBtn.disabled = true;
          unlockBtn.textContent = "Locked";
          passInput.disabled = true;
          return;
        }
        errorMsg.textContent = data.error || "Incorrect key.";
        unlockBtn.disabled = false;
        unlockBtn.textContent = "Unlock Download";
        passInput.select();
        return;
      }

      var token = data.token;
      formState.classList.add("hide");
      successState.classList.add("show");
      startDownload(token);
    } catch(e) {
      errorMsg.textContent = "Server error. Try again.";
      unlockBtn.disabled = false;
      unlockBtn.textContent = "Unlock Download";
    }
  }

  function startDownload(token) {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", "/api/download/file?token=" + encodeURIComponent(token), true);
    xhr.responseType = "blob";

    xhr.onprogress = function(e) {
      if (e.lengthComputable) {
        var pct = Math.round((e.loaded / e.total) * 100);
        progressFill.style.width = pct + "%";
        var mb = (e.loaded / 1048576).toFixed(1);
        var totalMb = (e.total / 1048576).toFixed(1);
        progressText.textContent = mb + " / " + totalMb + " MB (" + pct + "%)";
      }
    };

    xhr.onload = function() {
      if (xhr.status === 200) {
        progressFill.style.width = "100%";
        progressText.textContent = "Download complete!";
        var blob = xhr.response;
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "dominum-main.zip";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        downloadBtn.style.display = "";
        downloadBtn.onclick = function() { startDownload(token); };
      } else {
        progressText.textContent = "Download failed. Try refreshing.";
      }
    };

    xhr.onerror = function() {
      progressText.textContent = "Network error. Try again.";
    };

    xhr.send();
  }

  unlockBtn.addEventListener("click", tryUnlock);
  passInput.addEventListener("keydown", function(e) { if (e.key === "Enter") tryUnlock(); });
})();
</script>
</body>
</html>
