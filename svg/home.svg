<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Dominum home page</title>
  <desc id="desc">SVG wrapper embedding the full HTML document for home.</desc>
  <foreignObject x="0" y="0" width="1920" height="1080">
    <iframe xmlns="http://www.w3.org/1999/xhtml" title="Dominum home" style="width:1920px;height:1080px;border:0;background:#0b0f19;" srcdoc="&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;en&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;UTF-8&quot;&gt;
&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;
&lt;title&gt;Home - Dominum&lt;/title&gt;
&lt;link href=&quot;https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;
&lt;link rel=&quot;stylesheet&quot; href=&quot;https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css&quot;&gt;
&lt;style&gt;
  :root {
    --bg: #0b0a16;
    --accent: #7a5cff;
    --blue: #00bfff;
    --text: #e6e6ff;
    --surface: rgba(255, 255, 255, 0.05);
    --border: rgba(255, 255, 255, 0.1);
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: &#x27;Orbitron&#x27;, sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  #particles-js {
    position: fixed;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    z-index: 0;
  }
  .content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    animation: fadeScale 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  @keyframes fadeScale {
    from { opacity: 0; transform: scale(0.95) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .clock-container {
    margin-bottom: 15px;
  }
  .clock {
    font-size: 6rem;
    font-weight: 700;
    color: #ffffff;
    text-shadow: 0 0 40px rgba(122, 92, 255, 0.3);
    letter-spacing: 2px;
  }
  .clock .sec {
    color: rgba(255, 255, 255, 0.5);
  }
  .clock .ampm {
    font-size: 2rem;
    color: rgba(255, 255, 255, 0.5);
    margin-left: 10px;
    vertical-align: super;
  }
  .greeting {
    color: var(--text);
    font-size: 1.2rem;
    opacity: 0.7;
    margin-bottom: 50px;
    letter-spacing: 1px;
  }
  .shortcuts-row {
    display: flex;
    gap: 25px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .shortcut-card {
    width: 110px;
    height: 110px;
    background: var(--surface);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: var(--text);
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
  }
  .shortcut-card i {
    font-size: 2.2rem;
    margin-bottom: 12px;
    color: var(--text);
    transition: all 0.3s ease;
  }
  .shortcut-card span {
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 1px;
    opacity: 0.9;
  }
  .shortcut-card:hover {
    transform: translateY(-8px);
    border-color: var(--accent);
    background: rgba(122, 92, 255, 0.1);
    box-shadow: 0 15px 40px rgba(122, 92, 255, 0.4);
  }
  .shortcut-card:hover i {
    color: var(--accent);
    transform: scale(1.1);
  }
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
  &lt;div id=&quot;particles-js&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;content&quot;&gt;
    &lt;div class=&quot;clock-container&quot;&gt;
      &lt;div class=&quot;clock&quot; id=&quot;clockDisplay&quot;&gt;00:00&lt;span class=&quot;sec&quot;&gt;:00&lt;/span&gt; &lt;span class=&quot;ampm&quot;&gt;AM&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;greeting&quot; id=&quot;greetingDisplay&quot;&gt;welcome to dominum&lt;/div&gt;
    
    &lt;div class=&quot;shortcuts-row&quot;&gt;
      &lt;a href=&quot;src/assets/pages/games.html&quot; class=&quot;shortcut-card&quot;&gt;
        &lt;i class=&quot;fa-solid fa-gamepad&quot;&gt;&lt;/i&gt;
        &lt;span&gt;Games&lt;/span&gt;
      &lt;/a&gt;
      &lt;a href=&quot;src/assets/pages/apps.html&quot; class=&quot;shortcut-card&quot;&gt;
        &lt;i class=&quot;fa-solid fa-box-archive&quot;&gt;&lt;/i&gt;
        &lt;span&gt;Apps&lt;/span&gt;
      &lt;/a&gt;
      &lt;a href=&quot;src/assets/pages/search.html&quot; class=&quot;shortcut-card&quot;&gt;
        &lt;i class=&quot;fa-solid fa-magnifying-glass&quot;&gt;&lt;/i&gt;
        &lt;span&gt;Search&lt;/span&gt;
      &lt;/a&gt;
      &lt;a href=&quot;src/assets/pages/settings.html&quot; class=&quot;shortcut-card&quot;&gt;
        &lt;i class=&quot;fa-solid fa-gear&quot;&gt;&lt;/i&gt;
        &lt;span&gt;Settings&lt;/span&gt;
      &lt;/a&gt;
      &lt;a href=&quot;src/assets/pages/extras.html&quot; class=&quot;shortcut-card&quot;&gt;
        &lt;i class=&quot;fa-solid fa-plus&quot;&gt;&lt;/i&gt;
        &lt;span&gt;Extras&lt;/span&gt;
      &lt;/a&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;script src=&quot;https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js&quot;&gt;&lt;/script&gt;
  &lt;script&gt;
    function updateClock() {
      const now = new Date();
      let h = now.getHours();
      let m = now.getMinutes();
      let s = now.getSeconds();
      const ampm = h &gt;= 12 ? &#x27;PM&#x27; : &#x27;AM&#x27;;
      
      h = h % 12;
      h = h ? h : 12; 
      m = m &lt; 10 ? &#x27;0&#x27; + m : m;
      s = s &lt; 10 ? &#x27;0&#x27; + s : s;
      
      document.getElementById(&#x27;clockDisplay&#x27;).innerHTML = `${h}:${m}&lt;span class=&quot;sec&quot;&gt;:${s}&lt;/span&gt; &lt;span class=&quot;ampm&quot;&gt;${ampm}&lt;/span&gt;`;
      
      const greeting = document.getElementById(&#x27;greetingDisplay&#x27;);
      const hour24 = now.getHours();
      if (hour24 &lt; 12) greeting.innerText = &quot;good morning&quot;;
      else if (hour24 &lt; 18) greeting.innerText = &quot;good afternoon&quot;;
      else greeting.innerText = &quot;good evening&quot;;
    }
    
    setInterval(updateClock, 1000);
    updateClock();

    (function() {
      const particlesEnabled = localStorage.getItem(&#x27;dominum-particles&#x27;) !== &#x27;false&#x27;;
      const particlesContainer = document.getElementById(&#x27;particles-js&#x27;);
      if (particlesEnabled) {
        particlesContainer.style.display = &#x27;block&#x27;;
        particlesJS(&quot;particles-js&quot;, {
          &quot;particles&quot;: {
            &quot;number&quot;: { &quot;value&quot;: 60 },
            &quot;color&quot;: { &quot;value&quot;: [&quot;#7a5cff&quot;, &quot;#00bfff&quot;] },
            &quot;shape&quot;: { &quot;type&quot;: &quot;circle&quot; },
            &quot;opacity&quot;: { &quot;value&quot;: 0.5 },
            &quot;size&quot;: { &quot;value&quot;: 2 },
            &quot;line_linked&quot;: { &quot;enable&quot;: true, &quot;distance&quot;: 130, &quot;color&quot;: &quot;#7a5cff&quot;, &quot;opacity&quot;: 0.2, &quot;width&quot;: 1 },
            &quot;move&quot;: { &quot;enable&quot;: true, &quot;speed&quot;: 1.2, &quot;direction&quot;: &quot;none&quot;, &quot;out_mode&quot;: &quot;out&quot; }
          },
          &quot;interactivity&quot;: {
            &quot;events&quot;: { &quot;onhover&quot;: { &quot;enable&quot;: true, &quot;mode&quot;: &quot;repulse&quot; }, &quot;onclick&quot;: { &quot;enable&quot;: false } },
            &quot;modes&quot;: { &quot;repulse&quot;: { &quot;distance&quot;: 100 } }
          },
          &quot;retina_detect&quot;: true
        });
      } else {
        particlesContainer.style.display = &#x27;none&#x27;;
      }
    })();
  &lt;/script&gt;
&lt;script&gt;
const root = document.documentElement;
const themes = {
  default:{&quot;--bg&quot;:&quot;#0b0a16&quot;,&quot;--accent&quot;:&quot;#7a5cff&quot;,&quot;--blue&quot;:&quot;#00bfff&quot;,&quot;--text&quot;:&quot;#e6e6ff&quot;,&quot;--surface&quot;:&quot;rgba(255,255,255,0.05)&quot;,&quot;--border&quot;:&quot;rgba(255,255,255,0.1)&quot;},
  cyber:{&quot;--bg&quot;:&quot;#050c1b&quot;,&quot;--accent&quot;:&quot;#39ff14&quot;,&quot;--blue&quot;:&quot;#00ffff&quot;,&quot;--text&quot;:&quot;#e0ffe0&quot;,&quot;--surface&quot;:&quot;rgba(0,255,0,0.05)&quot;,&quot;--border&quot;:&quot;rgba(0,255,0,0.1)&quot;},
  sunset:{&quot;--bg&quot;:&quot;#1a0b0b&quot;,&quot;--accent&quot;:&quot;#ff6f61&quot;,&quot;--blue&quot;:&quot;#ffa500&quot;,&quot;--text&quot;:&quot;#fff0e6&quot;,&quot;--surface&quot;:&quot;rgba(255,110,100,0.05)&quot;,&quot;--border&quot;:&quot;rgba(255,110,100,0.1)&quot;},
  neon:{&quot;--bg&quot;:&quot;#0f0020&quot;,&quot;--accent&quot;:&quot;#ff00ff&quot;,&quot;--blue&quot;:&quot;#00ffff&quot;,&quot;--text&quot;:&quot;#ffffff&quot;,&quot;--surface&quot;:&quot;rgba(255,0,255,0.05)&quot;,&quot;--border&quot;:&quot;rgba(255,0,255,0.1)&quot;},
  darkred:{&quot;--bg&quot;:&quot;#1b0000&quot;,&quot;--accent&quot;:&quot;#ff0000&quot;,&quot;--blue&quot;:&quot;#cc0000&quot;,&quot;--text&quot;:&quot;#ffe6e6&quot;,&quot;--surface&quot;:&quot;rgba(255,0,0,0.05)&quot;,&quot;--border&quot;:&quot;rgba(255,0,0,0.1)&quot;},
  dnv2:{&quot;--bg&quot;:&quot;#050007&quot;,&quot;--accent&quot;:&quot;#ff00de&quot;,&quot;--blue&quot;:&quot;#00fff7&quot;,&quot;--text&quot;:&quot;#ffffff&quot;,&quot;--surface&quot;:&quot;rgba(255,0,255,0.05)&quot;,&quot;--border&quot;:&quot;rgba(255,0,255,0.15)&quot;},
  matrix:{&quot;--bg&quot;:&quot;#001100&quot;,&quot;--accent&quot;:&quot;#00ff00&quot;,&quot;--blue&quot;:&quot;#33ff33&quot;,&quot;--text&quot;:&quot;#99ff99&quot;,&quot;--surface&quot;:&quot;rgba(0,255,0,0.05)&quot;,&quot;--border&quot;:&quot;rgba(0,255,0,0.15)&quot;}
};
function applyTheme(theme){
  Object.entries(theme).forEach(([k,v])=&gt;root.style.setProperty(k,v));
}
(function(){
  const name = localStorage.getItem(&quot;dominum-theme&quot;) || &quot;default&quot;;
  if(name === &quot;custom&quot;){
    const custom = JSON.parse(localStorage.getItem(&quot;dominum-custom-theme&quot;) || &quot;{}&quot;);
    applyTheme(custom);
  } else applyTheme(themes[name]);
})();
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe>
  </foreignObject>
</svg>
