<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Dominum gam3 ports page</title>
  <desc id="desc">SVG wrapper embedding the full HTML document for gam3 ports.</desc>
  <foreignObject x="0" y="0" width="1920" height="1080">
    <iframe xmlns="http://www.w3.org/1999/xhtml" title="Dominum gam3 ports" style="width:1920px;height:1080px;border:0;background:#0b0f19;" srcdoc="&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;en&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;UTF-8&quot; /&gt;
&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot; /&gt;
&lt;title&gt;Game Ports - Dominum&lt;/title&gt;
&lt;link href=&quot;https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;
&lt;link rel=&quot;stylesheet&quot; href=&quot;https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css&quot; /&gt;
&lt;style&gt;
  :root {
    --bg: #0b0a16;
    --accent: #7a5cff;
    --blue: #00bfff;
    --text: #e6e6ff;
    --surface: rgba(255, 255, 255, 0.05);
    --border: rgba(255, 255, 255, 0.1);
  }
  * { box-sizing: border-box; outline: none; }
  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: &#x27;Orbitron&#x27;, sans-serif;
    margin: 0;
    padding: 2rem;
    overflow-x: hidden;
  }
  .controls-wrapper {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    margin-bottom: 2.5rem;
    padding: 20px;
    background: var(--surface);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.3);
    animation: slideDown 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .control-input {
    padding: 12px 18px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: rgba(0, 0, 0, 0.2);
    color: var(--text);
    font-family: &#x27;Orbitron&#x27;, sans-serif;
    font-size: 0.95rem;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
  }
  .control-input:hover { border-color: rgba(255, 255, 255, 0.2); }
  .control-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 15px rgba(122, 92, 255, 0.3);
    background: rgba(0, 0, 0, 0.4);
  }
  #searchBar { flex: 1 1 250px; }
  #container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 1.5rem;
  }
  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.9) translateY(20px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  .zone-item {
    background: var(--surface);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 16px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    opacity: 0; 
    animation: popIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.3s ease, border-color 0.3s ease;
  }
  .zone-item:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0 15px 30px rgba(122, 92, 255, 0.2);
    border-color: var(--accent);
    z-index: 2;
  }
  .img-wrapper {
    width: 100%;
    aspect-ratio: 1;
    overflow: hidden;
    background-color: rgba(0,0,0,0.3);
  }
  .zone-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
  }
  .zone-item:hover img { transform: scale(1.15); }
  .zone-item button {
    padding: 1rem 0.8rem;
    border: none;
    background: transparent;
    color: var(--text);
    font-family: &#x27;Orbitron&#x27;, sans-serif;
    font-size: 0.9rem;
    cursor: pointer;
    width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color 0.3s ease;
  }
  .zone-item:hover button { color: var(--accent); }
  #modalOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 2000;
    padding: 2rem;
    animation: fadeIn 0.3s ease forwards;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  #gameModal {
    width: 100%;
    max-width: 1200px;
    height: 85vh;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 25px 60px rgba(0,0,0,0.6);
    transform: scale(0.95);
    animation: modalPop 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }
  @keyframes modalPop { to { transform: scale(1); } }
  #fullscreenHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.2rem 2rem;
    background: rgba(0, 0, 0, 0.4);
    border-bottom: 1px solid var(--border);
  }
  #gameTitle {
    margin: 0;
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--text);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .header-controls { display: flex; gap: 12px; }
  .header-btn {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 1.1rem;
    cursor: pointer;
    padding: 0.6rem 1rem;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .header-btn:hover {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(122, 92, 255, 0.4);
  }
  #zoneFullscreenFrame { flex: 1; width: 100%; border: none; background: #000; }
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;

&lt;div class=&quot;controls-wrapper&quot;&gt;
  &lt;input type=&quot;text&quot; id=&quot;searchBar&quot; class=&quot;control-input&quot; placeholder=&quot;Search game ports...&quot; oninput=&quot;filterZones()&quot;&gt;
&lt;/div&gt;

&lt;div id=&quot;container&quot;&gt;Loading...&lt;/div&gt;

&lt;div id=&quot;modalOverlay&quot;&gt;
  &lt;div id=&quot;gameModal&quot;&gt;
    &lt;div id=&quot;fullscreenHeader&quot;&gt;
      &lt;h2 id=&quot;gameTitle&quot;&gt;Game Title&lt;/h2&gt;
      &lt;div class=&quot;header-controls&quot;&gt;
        &lt;button id=&quot;fullscreenBtn&quot; class=&quot;header-btn&quot; title=&quot;Fullscreen&quot;&gt;&lt;i class=&quot;fas fa-expand&quot;&gt;&lt;/i&gt;&lt;/button&gt;
        &lt;button id=&quot;closeFullscreen&quot; class=&quot;header-btn&quot; title=&quot;Close&quot;&gt;&lt;i class=&quot;fas fa-times&quot;&gt;&lt;/i&gt;&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;iframe id=&quot;zoneFullscreenFrame&quot;&gt;&lt;/iframe&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
const container = document.getElementById(&#x27;container&#x27;);
const searchBar = document.getElementById(&#x27;searchBar&#x27;);
const overlay = document.getElementById(&#x27;modalOverlay&#x27;);
const iframe = document.getElementById(&#x27;zoneFullscreenFrame&#x27;);
const closeBtn = document.getElementById(&#x27;closeFullscreen&#x27;);
const gameTitle = document.getElementById(&#x27;gameTitle&#x27;);
const fullscreenBtn = document.getElementById(&#x27;fullscreenBtn&#x27;);

const zonesURLs = [&quot;https://cdn.jsdelivr.net/gh/DominumNetwork/assets@main/zones.json&quot;];
const coverURL = &quot;https://cdn.jsdelivr.net/gh/DominumNetwork/covers@main/&quot;;
const htmlURL  = &quot;https://cdn.jsdelivr.net/gh/DominumNetwork/html@main&quot;;

let zones = [];
let zonesURL = zonesURLs[Math.floor(Math.random() * zonesURLs.length)];

async function loadZones() {
  try {
    const response = await fetch(zonesURL);
    zones = await response.json();
    zones = zones.filter(zone =&gt; zone.id &gt;= 0 &amp;&amp; zone.id &lt;= 9999);
    displayFiltered(zones);
  } catch (e) {
    container.innerHTML = &#x27;&lt;div style=&quot;width:100%; text-align:center; padding: 2rem; color: #ff4444;&quot;&gt;Failed to load game ports.&lt;/div&gt;&#x27;;
  }
}

function filterZones() {
  const query = searchBar.value.toLowerCase();
  const filtered = zones.filter(z =&gt; z.name.toLowerCase().includes(query));
  displayFiltered(filtered);
}

function displayFiltered(filteredZones) {
  container.innerHTML = &#x27;&#x27;;
  if (filteredZones.length === 0) {
    container.innerHTML = &#x27;&lt;div style=&quot;width:100%; text-align:center; padding: 2rem; color: var(--text); opacity: 0.7;&quot;&gt;No game ports found.&lt;/div&gt;&#x27;;
    return;
  }

  filteredZones.forEach((zone, index) =&gt; {
    const item = document.createElement(&#x27;div&#x27;);
    item.className = &#x27;zone-item&#x27;;
    
    const delay = Math.min(index * 0.03, 1.5);
    item.style.animationDelay = `${delay}s`;

    const imgWrapper = document.createElement(&#x27;div&#x27;);
    imgWrapper.className = &#x27;img-wrapper&#x27;;

    const img = document.createElement(&#x27;img&#x27;);
    img.dataset.src = zone.cover.replace(&#x27;{COVER_URL}&#x27;, coverURL);
    img.alt = zone.name;
    img.loading = &#x27;lazy&#x27;;

    const btn = document.createElement(&#x27;button&#x27;);
    btn.textContent = zone.name;
    
    item.onclick = () =&gt; openZone(zone);
    btn.onclick = (e) =&gt; { e.stopPropagation(); openZone(zone); };

    imgWrapper.appendChild(img);
    item.appendChild(imgWrapper);
    item.appendChild(btn);
    container.appendChild(item);
  });

  const imgs = document.querySelectorAll(&#x27;img[data-src]&#x27;);
  const observer = new IntersectionObserver((entries, obs) =&gt; {
    entries.forEach(e =&gt; {
      if (e.isIntersecting) {
        const img = e.target;
        img.src = img.dataset.src;
        obs.unobserve(img);
      }
    });
  }, { rootMargin: &#x27;100px&#x27;, threshold: 0.1 });
  imgs.forEach(i =&gt; observer.observe(i));
}

async function openZone(zone) {
  overlay.style.display = &#x27;flex&#x27;;
  gameTitle.textContent = zone.name;

  const zoneUrl = zone.url;
  if (!zoneUrl) return;

  const isAbsolute = zoneUrl.startsWith(&#x27;http&#x27;);
  if (isAbsolute) {
    iframe.src = zoneUrl;
  } else {
    const fullUrl = zoneUrl.replace(&#x27;{HTML_URL}&#x27;, htmlURL);
    try {
      const response = await fetch(fullUrl);
      const htmlContent = await response.text();
      const blob = new Blob([htmlContent], { type: &#x27;text/html&#x27; });
      const blobUrl = URL.createObjectURL(blob);
      iframe.src = blobUrl;
      iframe.onload = () =&gt; URL.revokeObjectURL(blobUrl);
    } catch (e) {
      iframe.src = fullUrl;
    }
  }
}

closeBtn.onclick = () =&gt; {
  overlay.style.display = &#x27;none&#x27;;
  iframe.src = &#x27;&#x27;;
};

overlay.onclick = (e) =&gt; {
  if (e.target === overlay) closeBtn.click();
}

fullscreenBtn.onclick = () =&gt; {
  iframe.requestFullscreen().catch(() =&gt; alert(&#x27;Fullscreen not supported.&#x27;));
};

loadZones();
&lt;/script&gt;

&lt;script&gt;
const root = document.documentElement;
const themes = {
  default:{&quot;--bg&quot;:&quot;#0b0a16&quot;,&quot;--accent&quot;:&quot;#7a5cff&quot;,&quot;--blue&quot;:&quot;#00bfff&quot;,&quot;--text&quot;:&quot;#e6e6ff&quot;,&quot;--surface&quot;:&quot;rgba(255,255,255,0.05)&quot;,&quot;--border&quot;:&quot;rgba(255,255,255,0.1)&quot;},
  cyber:{&quot;--bg&quot;:&quot;#050c1b&quot;,&quot;--accent&quot;:&quot;#39ff14&quot;,&quot;--blue&quot;:&quot;#00ffff&quot;,&quot;--text&quot;:&quot;#e0ffe0&quot;,&quot;--surface&quot;:&quot;rgba(0,255,0,0.05)&quot;,&quot;--border&quot;:&quot;rgba(0,255,0,0.1)&quot;},
  sunset:{&quot;--bg&quot;:&quot;#1a0b0b&quot;,&quot;--accent&quot;:&quot;#ff6f61&quot;,&quot;--blue&quot;:&quot;#ffa500&quot;,&quot;--text&quot;:&quot;#fff0e6&quot;,&quot;--surface&quot;:&quot;rgba(255,110,100,0.05)&quot;,&quot;--border&quot;:&quot;rgba(255,110,100,0.1)&quot;},
  neon:{&quot;--bg&quot;:&quot;#0f0020&quot;,&quot;--accent&quot;:&quot;#ff00ff&quot;,&quot;--blue&quot;:&quot;#00ffff&quot;,&quot;--text&quot;:&quot;#ffffff&quot;,&quot;--surface&quot;:&quot;rgba(255,0,255,0.05)&quot;,&quot;--border&quot;:&quot;rgba(255,0,255,0.1)&quot;},
  darkred:{&quot;--bg&quot;:&quot;#1b0000&quot;,&quot;--accent&quot;:&quot;#ff0000&quot;,&quot;--blue&quot;:&quot;#cc0000&quot;,&quot;--text&quot;:&quot;#ffe6e6&quot;,&quot;--surface&quot;:&quot;rgba(255,0,0,0.05)&quot;,&quot;--border&quot;:&quot;rgba(255,0,0,0.1)&quot;},
  dnv2:{&quot;--bg&quot;:&quot;#050007&quot;,&quot;--accent&quot;:&quot;#ff00de&quot;,&quot;--blue&quot;:&quot;#00fff7&quot;,&quot;--text&quot;:&quot;#ffffff&quot;,&quot;--surface&quot;:&quot;rgba(255,0,255,0.05)&quot;,&quot;--border&quot;:&quot;rgba(255,0,255,0.15)&quot;},
  matrix:{&quot;--bg&quot;:&quot;#001100&quot;,&quot;--accent&quot;:&quot;#00ff00&quot;,&quot;--blue&quot;:&quot;#33ff33&quot;,&quot;--text&quot;:&quot;#99ff99&quot;,&quot;--surface&quot;:&quot;rgba(0,255,0,0.05)&quot;,&quot;--border&quot;:&quot;rgba(0,255,0,0.15)&quot;}
};

function applyTheme(theme){
  Object.entries(theme).forEach(([k,v])=&gt;root.style.setProperty(k,v));
}

(function(){
  const name = localStorage.getItem(&quot;dominum-theme&quot;) || &quot;default&quot;;
  if(name === &quot;custom&quot;){
    const custom = JSON.parse(localStorage.getItem(&quot;dominum-custom-theme&quot;) || &quot;{}&quot;);
    applyTheme(custom);
  } else applyTheme(themes[name]);
})();
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;"></iframe>
  </foreignObject>
</svg>
