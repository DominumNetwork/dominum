<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyperCloak // URL Masking Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #05070c;
            --bg-secondary: #0b0e17;
            --bg-card: rgba(18, 24, 38, 0.65);
            --bg-input: rgba(11, 15, 25, 0.8);
            
            --border-glow: rgba(99, 102, 241, 0.25);
            --border-focus: #6366f1;
            --border-subtle: rgba(255, 255, 255, 0.08);

            --accent-primary: #6366f1;
            --accent-primary-hover: #4f46e5;
            --accent-cyan: #06b6d4;
            --accent-rose: #f43f5e;
            
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --text-dim: #6b7280;

            --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;

            --shadow-glow: 0 0 50px -10px rgba(99, 102, 241, 0.2);
            --shadow-card: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Dynamic Grid Background */
        .bg-grid {
            position: absolute;
            inset: 0;
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            z-index: 0;
            mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
        }

        /* Ambient Glow Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.45;
            pointer-events: none;
            z-index: 0;
            animation: orbFloat 18s ease-in-out infinite alternate;
        }

        .orb-1 {
            top: -10%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, var(--accent-primary) 0%, transparent 70%);
        }

        .orb-2 {
            bottom: -15%;
            right: -10%;
            width: 45vw;
            height: 45vw;
            background: radial-gradient(circle, var(--accent-cyan) 0%, transparent 70%);
            animation-delay: -9s;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -50px) scale(1.1); }
            100% { transform: translate(-20px, 40px) scale(0.95); }
        }

        /* App Window Frame */
        .app-window {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 540px;
            margin: 20px;
            background: var(--bg-card);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            box-shadow: var(--shadow-card), var(--shadow-glow);
            overflow: hidden;
            transition: border-color 0.4s ease, transform 0.4s ease;
        }

        .app-window:hover {
            border-color: rgba(99, 102, 241, 0.35);
        }

        /* Header Bar */
        .window-header {
            padding: 20px 28px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-cyan));
            display: grid;
            place-items: center;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        .brand-icon svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: #fff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .brand-text h1 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(to right, #ffffff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-family: var(--font-mono);
            color: #10b981;
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 4px 10px;
            border-radius: 20px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Form Body */
        .window-body {
            padding: 28px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }

        .input-label {
            font-size: 0.825rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            justify-content: space-between;
        }

        .input-label span.req {
            color: var(--accent-rose);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            width: 18px;
            height: 18px;
            stroke: var(--text-dim);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.3s ease;
            pointer-events: none;
        }

        input[type="text"],
        input[type="url"],
        select {
            width: 100%;
            height: 46px;
            padding: 0 16px 0 44px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            color: var(--text-main);
            font-family: var(--font-sans);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            appearance: none;
        }

        input::placeholder {
            color: var(--text-dim);
        }

        input:hover, select:hover {
            border-color: rgba(255, 255, 255, 0.15);
            background-color: rgba(15, 21, 35, 0.9);
        }

        input:focus, select:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
            background-color: rgba(15, 21, 35, 1);
        }

        input:focus ~ .input-icon,
        select:focus ~ .input-icon {
            stroke: var(--accent-primary);
        }

        /* Custom Dropdown Styling */
        .select-wrapper::after {
            content: '';
            position: absolute;
            right: 16px;
            width: 10px;
            height: 6px;
            background-color: var(--text-dim);
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            pointer-events: none;
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        .select-wrapper:focus-within::after {
            background-color: var(--accent-primary);
            transform: rotate(180deg);
        }

        select option {
            background-color: var(--bg-secondary);
            color: var(--text-main);
            padding: 10px;
        }

        /* Action Launch Button */
        .btn-launch {
            position: relative;
            margin-top: 8px;
            height: 50px;
            width: 100%;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-cyan));
            color: #ffffff;
            font-family: var(--font-sans);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.35);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-launch::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .btn-launch:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.5);
        }

        .btn-launch:hover::before {
            opacity: 1;
        }

        .btn-launch:active {
            transform: translateY(0);
            box-shadow: 0 2px 10px rgba(99, 102, 241, 0.3);
        }

        .btn-launch svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.3s ease;
        }

        .btn-launch:hover svg {
            transform: translateX(4px);
        }

        /* Footer Info */
        .window-footer {
            padding: 16px 28px;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .shortcut-hint {
            font-family: var(--font-mono);
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid var(--border-subtle);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .app-window { margin: 12px; }
            .window-header, .window-body { padding: 20px; }
            .window-footer { padding: 12px 20px; }
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="app-window">
        <!-- Window Topbar -->
        <div class="window-header">
            <div class="brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                </div>
                <div class="brand-text">
                    <h1>HyperCloak</h1>
                </div>
            </div>
            <div class="status-badge">
                <span class="status-dot"></span>
                <span>Engine Ready</span>
            </div>
        </div>

        <!-- Main Form -->
        <div class="window-body">
            <!-- Target URL -->
            <div class="input-group">
                <label class="input-label" for="targetUrl">
                    Target Destination <span class="req">*</span>
                </label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                    <input type="url" id="targetUrl" placeholder="https://example.com" autocomplete="off" spellcheck="false" required>
                </div>
            </div>

            <!-- Tab Title -->
            <div class="input-group">
                <label class="input-label" for="tabTitle">Disguise Title</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>
                    <input type="text" id="tabTitle" placeholder="Google Docs" autocomplete="off">
                </div>
            </div>

            <!-- Favicon URL -->
            <div class="input-group">
                <label class="input-label" for="tabIcon">Disguise Favicon URL</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
                    <input type="url" id="tabIcon" placeholder="https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico" autocomplete="off" spellcheck="false">
                </div>
            </div>

            <!-- Cloaking Mode -->
            <div class="input-group">
                <label class="input-label" for="cloakMethod">Execution Pipeline</label>
                <div class="input-wrapper select-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    <select id="cloakMethod">
                        <option value="aboutBlankTab">Open in About:Blank Tab</option>
                        <option value="aboutBlankWin">Open in About:Blank Window</option>
                        <option value="blobTab">Open in Blob Tab</option>
                        <option value="base64Tab">Open in Base64 Data Tab</option>
                    </select>
                </div>
            </div>

            <!-- Action Button -->
            <button class="btn-launch" onclick="launchCloaked()">
                <span>Execute Cloak</span>
                <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
            </button>
        </div>

        <!-- Window Footer -->
        <div class="window-footer">
            <span>Security Sandbox Active</span>
            <span>Press <span class="shortcut-hint">Enter</span> to launch</span>
        </div>
    </div>

    <script>
        try {
            Object.defineProperty(window, 'outerHeight', {
                get: function() { return window.innerHeight; }
            });
            Object.defineProperty(window, 'outerWidth', {
            get: function() { return window.innerWidth; }
            });
        } catch (e) {
            console.warn("Could not polyfill window dimensions:", e);
        }
    </script>

    <script>
        // Enter Key Listener
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                launchCloaked();
            }
        });

        function getHTMLContent(url, title, icon) {
    const titleTag = title ? `<title>${escapeHtml(title)}</title>` : '<title>Google</title>';
    const iconTag = icon ? `<link rel="icon" type="image/x-icon" href="${escapeHtml(icon)}">` : '';
    
    return `<!DOCTYPE html>
<html style="margin:0;padding:0;height:100%;width:100%;overflow:hidden;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    ${titleTag}
    ${iconTag}
    <style>
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: #000; }
        iframe { width: 100%; height: 100%; border: none; outline: none; display: block; }
    </style>
</head>
<body>
    <iframe 
        src="${escapeHtml(url)}" 
        allowfullscreen="true" 
        webkitallowfullscreen="true" 
        mozallowfullscreen="true" 
        allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share; fullscreen"
        sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-popups allow-downloads allow-modals">
    </iframe>
</body>
</html>`;
}

        function escapeHtml(string) {
            return String(string).replace(/[&<>"']/g, function(s) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                }[s];
            });
        }

        function launchCloaked() {
            let url = document.getElementById('targetUrl').value.trim();
            const title = document.getElementById('tabTitle').value.trim();
            const icon = document.getElementById('tabIcon').value.trim();
            const method = document.getElementById('cloakMethod').value;

            if (!url) {
                const inputWrapper = document.getElementById('targetUrl').parentElement;
                inputWrapper.style.transform = 'translateX(-6px)';
                setTimeout(() => inputWrapper.style.transform = 'translateX(6px)', 100);
                setTimeout(() => inputWrapper.style.transform = 'translateX(-4px)', 200);
                setTimeout(() => inputWrapper.style.transform = 'translateX(0)', 300);
                document.getElementById('targetUrl').focus();
                return;
            }

            // Ensure URL protocol exists
            if (!/^https?:\/\//i.test(url)) {
                url = 'https://' + url;
            }

            const html = getHTMLContent(url, title, icon);

            if (method === 'aboutBlankTab') {
                const win = window.open('about:blank', '_blank');
                if (win) {
                    win.document.write(html);
                    win.document.close();
                }
            } 
            else if (method === 'aboutBlankWin') {
                const win = window.open('about:blank', '_blank', 'width=1200,height=800,scrollbars=no,resizable=yes');
                if (win) {
                    win.document.write(html);
                    win.document.close();
                }
            } 
            else if (method === 'blobTab') {
                const blob = new Blob([html], { type: 'text/html' });
                const blobUrl = URL.createObjectURL(blob);
                window.open(blobUrl, '_blank');
            } 
            else if (method === 'base64Tab') {
                const base64Url = 'data:text/html;base64,' + btoa(unescape(encodeURIComponent(html)));
                window.open(base64Url, '_blank');
            }
        }
    </script>
</body>
</html>
