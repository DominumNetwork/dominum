<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
	:root {
		--bg: #0a0518;
		--accent: #7c3aed;
		--blue: #a78bfa;
		--text: #ede9fe;
		--surface: rgba(139, 92, 246, 0.07);
		--border: rgba(167, 139, 250, 0.18);
		--card-bg: rgba(18, 10, 36, 0.45);
	}
	* { box-sizing: border-box; }
	html {
		height: 100%;
		background: var(--bg);
	}
	body {
		margin: 0; padding: 0; height: 100%;
		background: transparent;
		color: var(--text);
		font-family: 'Inter', sans-serif;
		overflow-y: auto;
		overflow-x: hidden;
	}
	#dark-veil-bg {
		position: fixed;
		inset: 0;
		width: 100%;
		height: 100%;
		z-index: -1;
		pointer-events: none;
		opacity: 0.9;
		background: transparent;
	}

	.page {
		max-width: 900px;
		margin: 0 auto;
		padding: 48px 32px 80px;
	}
	h1 {
		font-size: 2rem;
		font-weight: 800;
		margin: 0 0 8px;
		letter-spacing: -0.02em;
	}
	.subtitle {
		font-size: 0.88rem;
		opacity: 0.55;
		margin-bottom: 32px;
	}

	.extras-buttons {
		display: grid;
		grid-template-columns: repeat(4, 1fr);
		grid-auto-rows: 92px;
		gap: 14px;
	}
	.extras-btn {
		background: transparent;
		background-color: var(--surface);
		backdrop-filter: blur(22px) saturate(160%);
		-webkit-backdrop-filter: blur(22px) saturate(160%);
		border: 1px solid var(--border);
		color: var(--text);
		border-radius: 16px;
		cursor: pointer;
		font-size: 0.85rem;
		font-family: inherit;
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		gap: 8px;
		text-transform: uppercase;
		letter-spacing: 0.8px;
		transition: background-color 0.15s ease, color 0.15s ease;
	}
	.extras-btn i { font-size: 1.3em; }
	.extras-btn.wide {
		grid-column: span 2;
		flex-direction: row;
		font-size: 0.95rem;
	}
	.extras-btn:hover { background-color: var(--accent); color: #fff; }
	.extras-btn:disabled { opacity: 0.4; cursor: default; }
	.extras-btn:disabled:hover { background-color: var(--surface); color: var(--text); }

	.modal {
		display: none;
		position: fixed; inset: 0;
		z-index: 1000;
		justify-content: center; align-items: center;
		background: rgba(5, 3, 12, 0.6);
		backdrop-filter: blur(10px);
		-webkit-backdrop-filter: blur(10px);
		opacity: 0;
		transition: opacity 0.2s ease;
		padding: 20px;
	}
	.modal.active { display: flex; opacity: 1; }
	.modal-content {
		background: color-mix(in srgb, var(--bg) 70%, black);
		backdrop-filter: blur(30px) saturate(160%);
		-webkit-backdrop-filter: blur(30px) saturate(160%);
		border: 1px solid var(--border);
		border-radius: 18px;
		padding: 24px;
		width: 100%;
		max-width: 640px;
		max-height: 80vh;
		overflow-y: auto;
		box-shadow: 0 20px 55px rgba(0,0,0,0.5);
		position: relative;
	}
	.modal-header {
		display: flex; justify-content: space-between; align-items: center;
		margin-bottom: 18px;
		border-bottom: 1px solid var(--border);
		padding-bottom: 12px;
	}
	.modal-header h2 { color: var(--text); font-size: 1.2em; margin: 0; font-weight: 700; }
	.close-btn {
		cursor: pointer;
		width: 28px; height: 28px;
		display: flex; align-items: center; justify-content: center;
		border-radius: 8px;
		color: var(--text);
		opacity: 0.6;
		transition: opacity 0.15s ease, background 0.15s ease;
	}
	.close-btn:hover { opacity: 1; background: rgba(255,255,255,0.08); }

	.card {
		background: var(--surface);
		border: 1px solid var(--border);
		border-radius: 12px;
		padding: 14px;
		display: flex; align-items: flex-start; gap: 14px;
		margin-bottom: 10px;
		transition: border-color 0.15s ease;
		cursor: pointer;
	}
	.card:hover { border-color: var(--accent); }
	.card img { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
	.card-content { flex: 1; min-width: 0; }
	.card h3 { margin: 0; font-size: 1rem; color: var(--text); font-weight: 700; }
	.card p.role { font-size: 0.8rem; color: var(--blue); margin: 2px 0 4px; }
	.card p.desc { font-size: 0.8rem; color: var(--text); opacity: 0.7; line-height: 1.4; }

	.link-btns { display: flex; gap: 10px; justify-content: center; margin-top: 14px; }
	.link-btn {
		background: var(--surface);
		border: 1px solid var(--accent);
		color: var(--text);
		padding: 9px 18px;
		border-radius: 9px;
		cursor: pointer;
		font-family: inherit;
		font-size: 0.85rem;
		transition: background 0.15s ease, color 0.15s ease;
	}
	.link-btn:hover { background: var(--accent); color: #fff; }

	#vortex-links { display: flex; flex-direction: column; gap: 8px; }
	#vortex-links .card { justify-content: center; }
	#vortex-links .card h3 { font-size: 0.9rem; }

	#embed-container {
		display: none;
		position: fixed; inset: 0;
		z-index: 2000;
		background: #000;
	}
	#embed-container .close-embed-btn {
		position: absolute; top: 14px; right: 16px; z-index: 2001;
		background: var(--accent);
		color: #fff;
		border: none;
		border-radius: 9px;
		padding: 9px 18px;
		font-family: inherit;
		text-transform: uppercase;
		letter-spacing: 0.5px;
		font-size: 0.8rem;
		cursor: pointer;
	}
	#embed-frame { width: 100%; height: 100%; border: none; }
</style>

<div class="modal" id="vortex-modal">

			<h2>Vortex Chat</h2>

<div id="embed-container">

	function renderCredits() {
		const container = document.getElementById('credits-container');
		container.innerHTML = '';
		siteCredits.forEach(credit => {
			const card = document.createElement('div');
			card.className = 'card';
			card.onclick = () => openProfile(credit.name, credit.role, credit.desc, credit.img);
			card.innerHTML = `
				<img src="${credit.img}" alt="">
				<div class="card-content">
					<h3></h3>
					<p class="role"></p>
					<p class="desc"></p>
				</div>
			`;
			card.querySelector('h3').textContent = credit.name;
			card.querySelector('.role').textContent = credit.role;
			card.querySelector('.desc').textContent = credit.desc;
			container.appendChild(card);
		});
	}

	function renderPartners() {

		container.innerHTML = '';
		sitePartners.forEach(partner => {

			card.onclick = () => handlePartnerClick(partner.name, partner.owner, partner.desc, partner.img, partner.discord, partner.website);

			card.className = 'card';
			card.onclick = () => openEmbed(url);
			card.innerHTML = `<h3>Link ${i + 1}</h3>`;
			container.appendChild(card);
		});
	}

	function closeModal(id) { document.getElementById(id).classList.remove('active'); }

	document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => {
		if (e.target === m) closeModal(m.id);
	}));

	function openProfile(name, role, desc, img) {
		document.getElementById('profile-name').textContent = name;
		document.getElementById('profile-role').textContent = role;
		document.getElementById('profile-desc').textContent = desc;
		document.getElementById('profile-img').src = img;
		openModal('profile-modal');
	}

	function handlePartnerClick(name, owner, desc, img, discord, website) {
		if ((!discord || discord === 'none') && website && website !== 'none') {
			window.open(website, '_blank');
			return;
		}
		if ((!website || website === 'none') && discord && discord !== 'none') {
			window.open(discord, '_blank');
			return;
		}
		if ((!website || website === 'none') && (!discord || discord === 'none')) {
			alert('No links provided for this partner yet!');
			return;
		}

		currentPartner = { name, discord, website };
		document.getElementById('partner-name').textContent = name;

		const dBtn = document.getElementById('discord-btn');
		const wBtn = document.getElementById('website-btn');
		dBtn.style.display = (discord && discord !== 'none') ? 'inline-block' : 'none';
		wBtn.style.display = (website && website !== 'none') ? 'inline-block' : 'none';

		openModal('partner-link-modal');
	}

	document.getElementById('discord-btn').addEventListener('click', () => {
		closeModal('partner-link-modal');
		if (currentPartner.discord && currentPartner.discord !== 'none') window.open(currentPartner.discord, '_blank');
	});
	document.getElementById('website-btn').addEventListener('click', () => {
		closeModal('partner-link-modal');
		if (currentPartner.website && currentPartner.website !== 'none') window.open(currentPartner.website, '_blank');
	});

	function openEmbed(url) {
		closeModal('vortex-modal');
		document.getElementById('embed-frame').src = url;
		document.getElementById('embed-container').style.display = 'block';
	}
	function closeEmbed() {
		document.getElementById('embed-frame').src = '';
		document.getElementById('embed-container').style.display = 'none';

	function openEaglerLauncher() {
		const targetUrl = 'src/assets/pages/ampler-launcher.html';
		const newTab = window.open('about:blank', '_blank');
		fetch(targetUrl)
			.then(response => response.text())
			.then(html => {
				newTab.document.open();
				newTab.document.write(html);
				newTab.document.close();
			})
			.catch(err => {
				console.error('Failed to load the launcher:', err);
				newTab.location.href = targetUrl;
			});
	}

	function openDataGen() {
		const page = 'data-generator.html';
		if (window.parent && window.parent.document.getElementById('content-frame')) {
			window.parent.document.getElementById('content-frame').src = 'src/assets/pages/' + page;
		} else {
			window.location.href = page;
		}
	}
</script>
<script>
const root = document.documentElement;
const themes = {
	default:{"--bg":"#0a0518","--accent":"#7c3aed","--blue":"#a78bfa","--text":"#ede9fe","--surface":"rgba(139,92,246,0.07)","--border":"rgba(167,139,250,0.18)","--card-bg":"rgba(18,10,36,0.45)"},
	cyber:{"--bg":"#050c1b","--accent":"#39ff14","--blue":"#00ffff","--text":"#e0ffe0","--surface":"rgba(0,255,0,0.05)","--border":"rgba(0,255,0,0.1)","--card-bg":"rgba(0,255,0,0.03)"},
	sunset:{"--bg":"#1a0b0b","--accent":"#ff6f61","--blue":"#ffa500","--text":"#fff0e6","--surface":"rgba(255,110,100,0.05)","--border":"rgba(255,110,100,0.1)","--card-bg":"rgba(255,110,100,0.03)"},
	neon:{"--bg":"#0f0020","--accent":"#ff00ff","--blue":"#00ffff","--text":"#ffffff","--surface":"rgba(255,0,255,0.05)","--border":"rgba(255,0,255,0.1)","--card-bg":"rgba(255,0,255,0.03)"},
	darkred:{"--bg":"#1b0000","--accent":"#ff0000","--blue":"#cc0000","--text":"#ffe6e6","--surface":"rgba(255,0,0,0.05)","--border":"rgba(255,0,0,0.1)","--card-bg":"rgba(255,0,0,0.03)"},
	dnv2:{"--bg":"#050007","--accent":"#ff00de","--blue":"#00fff7","--text":"#ffffff","--surface":"rgba(255,0,255,0.05)","--border":"rgba(255,0,255,0.15)","--card-bg":"rgba(15,0,30,0.7)"},
	matrix:{"--bg":"#001100","--accent":"#00ff00","--blue":"#33ff33","--text":"#99ff99","--surface":"rgba(0,255,0,0.05)","--border":"rgba(0,255,0,0.15)","--card-bg":"rgba(0,50,0,0.7)"}
};
function applyTheme(theme){
	Object.entries(theme).forEach(([k,v])=>root.style.setProperty(k,v));
}
(function(){
	const name = localStorage.getItem("dominum-theme") || "default";
	if(name === "custom"){
		const custom = JSON.parse(localStorage.getItem("dominum-custom-theme") || "{}");
		applyTheme(custom);
	} else applyTheme(themes[name]);
})();
</script>
