<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0d0d10; font-family: system-ui, sans-serif; color: #eee; }
    #chat { width: min(420px, 100vw - 32px); height: 560px; display: flex; flex-direction: column; background: #16161b; border: 1px solid #26262e; border-radius: 14px; overflow: hidden; }
    header { padding: 14px 16px; border-bottom: 1px solid #26262e; font-weight: 600; }
    #status { margin: 0; padding: 10px 16px; color: #8a8a96; font-size: 14px; }
    #status:empty { display: none; }
    #messages { flex: 1; margin: 0; padding: 8px 16px; overflow-y: auto; list-style: none; }
    #messages li { display: flex; gap: 10px; padding: 6px 0; line-height: 1.4; }
    #messages img { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; }
    #messages b { display: block; font-size: 14px; }
    #messages span { overflow-wrap: anywhere; }
    #composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #26262e; }
    #composer input { flex: 1; padding: 10px 12px; background: #0d0d10; border: 1px solid #26262e; border-radius: 8px; color: inherit; font: inherit; }
    button { padding: 10px 16px; border: 0; border-radius: 8px; background: #bb00ff; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    #login { margin: auto; }
    .vortex-mention { color: #d27bff; font-weight: 600; }
    .vortex-emote { height: 1.4em; vertical-align: middle; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="chat">
    <header id="title">Chat</header>
    <p id="status">Loading...</p>
    <button id="login" hidden>Log in with Vortex</button>
    <ul id="messages"></ul>
    <form id="composer" hidden>
      <input id="text" maxlength="2000" placeholder="Say something" autocomplete="off" />
      <button>Send</button>
    </form>
  </div>

  <script src="https://vtx.chat/sdk/v1/vortex.js"></script>
  <script>
    const vortex = Vortex.init({ clientId: "vtx_7d67ad1e4c32e32bb9f2" });
    const list = document.getElementById("messages");
    const status = (text) => (document.getElementById("status").textContent = text || "");

    function show(msg) {
      const li = document.createElement("li");
      li.dataset.id = msg.id;
      const avatar = Object.assign(document.createElement("img"), { src: msg.author.avatar, alt: "" });
      const body = document.createElement("div");
      const name = Object.assign(document.createElement("b"), { textContent: msg.author.username });
      const text = Object.assign(document.createElement("span"), { innerHTML: msg.html });
      body.append(name, text);
      li.append(avatar, body);
      list.appendChild(li);
      list.scrollTop = list.scrollHeight;
    }

    vortex.ready.then(async () => {
      if (!vortex.site.allowed) return status(vortex.site.reason);

      if (!vortex.user) {
        status("");
        const btn = document.getElementById("login");
        btn.hidden = false;
        btn.onclick = () =>
          vortex.login({ popup: true }).then(
            () => location.reload(),
            (err) => status(err.message),
          );
        return;
      }

      const channel = vortex.channels.find((c) => c.id === vortex.channel);
      document.getElementById("title").textContent = `${vortex.guild.name}${channel ? ` · #${channel.name}` : ""}`;

      try {
        const { messages } = await vortex.history();
        messages.forEach(show);
        status(messages.length ? "" : "No messages yet. Say hi!");
      } catch (err) {
        return status(err.message);
      }
      vortex.onmessage = (msg) => {
        status("");
        show(msg);
      };
      vortex.on("delete", ({ id }) => list.querySelector(`[data-id="${id}"]`)?.remove());

      const form = document.getElementById("composer");
      form.hidden = !channel?.canSend;
      form.onsubmit = async (e) => {
        e.preventDefault();
        const input = document.getElementById("text");
        if (!input.value.trim()) return;
        try {
          await vortex.send(input.value);
          input.value = "";
        } catch (err) {
          status(err.message);
        }
      };
    });
  </script>
</body>
</html>
