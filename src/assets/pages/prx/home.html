<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
	:root {
		--text: #ede9fe;
		--accent: #7c3aed;
		--blue: #a78bfa;
		--surface: rgba(139, 92, 246, 0.07);
		--border: rgba(167, 139, 250, 0.18);
	}

	html, body {
		margin: 0;
		padding: 0;
		height: 100%;
		font-family: 'Inter', sans-serif;
		background: #0a0518;
		color: var(--text);
		overflow: hidden;
	}

	#dark-veil-bg {
		position: fixed;
		inset: 0;
		width: 100%;
		height: 100%;
		z-index: 0;
		pointer-events: none;
		opacity: 0.6;
	}

	.content {
		position: relative;
		z-index: 1;
		height: 100%;
		display: flex;
		flex-direction: column;
		justify-content: center;
		align-items: center;
		text-align: center;
		padding: 0 20px;
		animation: fadeUp 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
	}

	@keyframes fadeUp {
		from { opacity: 0; transform: translateY(10px); }
		to { opacity: 1; transform: translateY(0); }
	}

	.logo {
		font-size: 1.6rem;
		font-weight: 800;
		margin-bottom: 30px;
		color: var(--text);
		letter-spacing: -0.02em;
	}

	.engine-toggle {
		display: flex;
		gap: 2px;
		background: color-mix(in srgb, var(--text) 5%, transparent);
		border: 1px solid var(--border);
		border-radius: 10px;
		padding: 3px;
		margin-bottom: 20px;
	}

	.engine-toggle button {
		display: flex;
		align-items: center;
		gap: 6px;
		border: none;
		background: transparent;
		color: var(--text);
		opacity: 0.55;
		padding: 6px 14px 6px 6px;
		border-radius: 7px;
		font-size: 0.78rem;
		font-family: inherit;
		letter-spacing: 0.3px;
		cursor: pointer;
		transition: background 0.15s ease, opacity 0.15s ease;
	}

	.engine-toggle button.active {
		background: color-mix(in srgb, var(--accent) 22%, transparent);
		opacity: 1;
	}

	.engine-badge {
		width: 16px; height: 16px;
		border-radius: 4px;
		object-fit: contain;
		flex-shrink: 0;
	}

	.search-container {
		position: relative;
		width: 100%;
		max-width: 480px;
		display: flex;
		align-items: center;
		background: color-mix(in srgb, var(--text) 3%, transparent);
		backdrop-filter: blur(24px) saturate(160%);
		-webkit-backdrop-filter: blur(24px) saturate(160%);
		border: 1px solid var(--border);
		border-radius: 14px;
		padding: 4px 4px 4px 16px;
		transition: border-color 0.15s ease, background 0.15s ease;
	}

	.search-container:focus-within {
		border-color: var(--accent);
		background: color-mix(in srgb, var(--text) 5%, transparent);
	}

	.search-container i.fa-magnifying-glass {
		opacity: 0.4;
		font-size: 0.85rem;
		flex-shrink: 0;
	}

	.search-container input {
		flex: 1;
		padding: 12px 12px;
		border: none;
		background: transparent;
		color: var(--text);
		font-family: inherit;
		font-size: 0.92rem;
		outline: none;
	}

	.search-container input::placeholder { color: rgba(255,255,255,0.35); }

	.search-container button {
		width: 38px;
		height: 38px;
		flex-shrink: 0;
		border: none;
		background: var(--accent);
		color: #fff;
		border-radius: 10px;
		cursor: pointer;
		font-size: 0.85rem;
		display: flex;
		align-items: center;
		justify-content: center;
		transition: background 0.15s ease, transform 0.1s ease;
	}

	.search-container button:hover { background: #6d28d9; }
	.search-container button:active { transform: scale(0.92); }

	#status {
		margin-top: 16px;
		font-size: 0.72rem;
		opacity: 0.4;
		letter-spacing: 0.3px;
	}
</style>
<link rel="stylesheet" href="/src/assets/theme-minimal.css">
</head>
<body>

<canvas id="dark-veil-bg" data-dark-veil data-speed="0.35" data-warp-amount="0.6" data-resolution-scale="0.75"></canvas>

<div class="content">
	<div class="logo">Dominum</div>

	<div class="engine-toggle" id="engineToggle">
		<button data-engine="scramjet" class="active"><img class="engine-badge" src="/src/assets/images/engines/scramjet.webp" alt="">Scramjet</button>
		<button data-engine="uv"><img class="engine-badge" src="/src/assets/images/engines/uv.png" alt="">UV</button>
	</div>

	<div class="search-container">
		<i class="fa-solid fa-magnifying-glass"></i>
		<input type="text" id="searchInput" placeholder="Search the web...">
		<button id="searchBtn"><i class="fa-solid fa-arrow-right"></i></button>
	</div>
	<div id="status"></div>
</div>

<script src="/src/assets/js/dark-veil.js"></script>
<script src="/config.js"></script>
<script src="/baremux/index.js"></script>
<script src="/scram/scramjet.all.js"></script>
<script src="/uv2/uv/uv.bundle.js"></script>
<script src="/uv2/uv/uv.config.js"></script>
<script src="/src/assets/vendor/jszip.min.js"></script>

<script type="module">
	import { installExtension } from "/src/assets/js/ext/extensions.js";
	import { installHub, injectExtensionsIntoFrame } from "/src/assets/js/ext/ext-runtime.js";
	import { startAllBackgrounds } from "/src/assets/js/ext/ext-background.js";

	installHub();
	startAllBackgrounds().catch((e) => console.warn("[ext-bg]", e));

	window.addEventListener("message", (e) => {
		if (e.data?.type === "__dominum_cws_install" && e.data.id) {
			installExtension(e.data.id).catch(() => {});
		}
	});

	window.__dominumInjectExtensions = injectExtensionsIntoFrame;
</script>

<script>
	const params = new URLSearchParams(window.location.search);
	const TAB_ID = params.get('tabId') || '';

	const WISP_URL = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/wisp/";

	const { ScramjetController } = $scramjetLoadController();
	const scramjet = new ScramjetController({
		files: {
			wasm: "/scram/wasm.wasm",
			all: "/scram/scramjet.all.js",
			sync: "/scram/scramjet.sync.js"
		}
	});
	scramjet.init();
	navigator.serviceWorker.register("/sw.js");
	navigator.serviceWorker.register("/uv2/uv/sw.js", { scope: "/uv2/uv/service/" });

	const connection = new BareMux.BareMuxConnection("/baremux/worker.js");

	async function initTransport() {
		if ((await connection.getTransport()) !== "/libcurl/index.mjs") {
			await connection.setTransport("/libcurl/index.mjs", [{ websocket: WISP_URL }]);
		}
	}
	initTransport();

	let engine = localStorage.getItem("dominum-engine") || "scramjet";
	const toggle = document.getElementById("engineToggle");
	function setEngine(name) {
		engine = name;
		localStorage.setItem("dominum-engine", name);
		toggle.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.engine === name));
	}
	toggle.addEventListener("click", e => {
		const btn = e.target.closest("button");
		if (btn) setEngine(btn.dataset.engine);
	});
	setEngine(engine);

	const searchInput = document.getElementById('searchInput');
	const searchBtn = document.getElementById('searchBtn');
	const statusEl = document.getElementById('status');

	function formatUrl(input) {
			try { return new URL(input).toString(); } catch (err) {}
			try {
					const url = new URL(`http://${input}`);
					if (url.hostname.includes(".")) return url.toString();
			} catch (err) {}
			return `https://search.brave.com/search?q=${encodeURIComponent(input)}`;
	}

	function getRealUrl(frame) {
		try {
			if (engine === 'uv') {
				const cfg = window.__uv$config;
				const loc = frame.contentWindow.location;
				if (cfg && loc.pathname.startsWith(cfg.prefix)) {
					const encoded = loc.pathname.slice(cfg.prefix.length).split('/')[0];
					return cfg.decodeUrl(encoded);
				}
			} else {
				return scramjet.decodeUrl(frame.contentWindow.location.href);
			}
		} catch (e) {}
		return null;
	}

	function reportState() {
		const frame = document.getElementById('prx-frame');
		if (!frame || !TAB_ID) return;
		let title = null, fav = null;
		try { title = frame.contentDocument?.title || null; } catch {}
		try {
			const link = frame.contentDocument?.querySelector('link[rel~="icon"]');
			fav = link ? link.href : null;
		} catch {}
		const url = getRealUrl(frame);
		window.parent.postMessage({ type: 'dominum-tab-state', tabId: TAB_ID, url, title, fav }, location.origin);
	}
	setInterval(reportState, 700);

	async function performSearch(query) {
			if (!query) return;
			const formattedUrl = formatUrl(query);
			statusEl.textContent = `loading via ${engine}...`;

			let existingFrame = document.getElementById("prx-frame");
			if (existingFrame) existingFrame.remove();

			if (engine === "uv") {
					await navigator.serviceWorker.ready;
					const frame = document.createElement("iframe");
					frame.id = "prx-frame";
					frame.style.border = "none";
					frame.style.position = "absolute";
					frame.style.top = "0";
					frame.style.left = "0";
					frame.style.width = "100%";
					frame.style.height = "100%";
					frame.style.zIndex = "999";
					frame.style.backgroundColor = "#000";
					document.body.appendChild(frame);
					frame.src = __uv$config.prefix + __uv$config.encodeUrl(formattedUrl);
					frame.onload = () => {
							statusEl.textContent = "";
							window.__dominumInjectExtensions?.(frame).catch?.(() => {});
							reportState();
					};
					return;
			}

			await navigator.serviceWorker.ready;
			if (!navigator.serviceWorker.controller) {
					window.location.reload();
					return;
			}

			const frameObj = scramjet.createFrame();
			const frameElement = frameObj.frame;
			frameElement.id = "prx-frame";
			frameElement.style.border = "none";
			frameElement.style.position = "absolute";
			frameElement.style.top = "0";
			frameElement.style.left = "0";
			frameElement.style.width = "100%";
			frameElement.style.height = "100%";
			frameElement.style.zIndex = "999";
			frameElement.style.backgroundColor = "#000";

			document.body.appendChild(frameElement);
			frameElement.addEventListener("load", () => {
					window.__dominumInjectExtensions?.(frameElement).catch?.(() => {});
					statusEl.textContent = "";
					reportState();
			});
			frameObj.go(formattedUrl);
	}

	searchBtn.addEventListener('click', () => performSearch(searchInput.value.trim()));
	searchInput.addEventListener('keydown', e => {
			if (e.key === 'Enter') performSearch(searchInput.value.trim());
	});

	const targetUrl = params.get('url');
	if (targetUrl) {
			performSearch(decodeURIComponent(targetUrl));
	}
</script>
<script>
const root = document.documentElement;
const themes = {
	default:{"--bg":"#0a0518","--accent":"#7c3aed","--blue":"#a78bfa","--text":"#ede9fe","--surface":"rgba(139,92,246,0.07)","--border":"rgba(167,139,250,0.18)"},
	cyber:{"--bg":"#050c1b","--accent":"#39ff14","--blue":"#00ffff","--text":"#e0ffe0","--surface":"rgba(0,255,0,0.05)","--border":"rgba(0,255,0,0.1)"},
	sunset:{"--bg":"#1a0b0b","--accent":"#ff6f61","--blue":"#ffa500","--text":"#fff0e6","--surface":"rgba(255,110,100,0.05)","--border":"rgba(255,110,100,0.1)"},
	neon:{"--bg":"#0f0020","--accent":"#ff00ff","--blue":"#00ffff","--text":"#ffffff","--surface":"rgba(255,0,255,0.05)","--border":"rgba(255,0,255,0.1)"},
	darkred:{"--bg":"#1b0000","--accent":"#ff0000","--blue":"#cc0000","--text":"#ffe6e6","--surface":"rgba(255,0,0,0.05)","--border":"rgba(255,0,0,0.1)"},
	dnv2:{"--bg":"#050007","--accent":"#ff00de","--blue":"#00fff7","--text":"#ffffff","--surface":"rgba(255,0,255,0.05)","--border":"rgba(255,0,255,0.15)"},
	matrix:{"--bg":"#001100","--accent":"#00ff00","--blue":"#33ff33","--text":"#99ff99","--surface":"rgba(0,255,0,0.05)","--border":"rgba(0,255,0,0.15)"}
};
function applyTheme(theme){
	Object.entries(theme).forEach(([k,v])=>root.style.setProperty(k,v));
}
(function(){
	const name = localStorage.getItem("dominum-theme") || "default";
	if(name === "custom"){
		const custom = JSON.parse(localStorage.getItem("dominum-custom-theme") || "{}");
		applyTheme(custom);
	} else applyTheme(themes[name]);
})();
</script>
</body>
</html>
